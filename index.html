<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMIRALI ZARE | Personal Cyber Bio</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Vazirmatn & Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070913;
      --accent-cyan: #00f3ff;
      --accent-blue: #0066ff;
      --accent-purple: #8a2be2;
      --text-main: #ffffff;
      --text-muted: #8e9bb0;
      --glass-bg: rgba(13, 17, 33, 0.65);
      --glass-border: rgba(0, 243, 255, 0.2);
      --glass-hover: rgba(0, 243, 255, 0.35);
      --neon-glow: 0 0 25px rgba(0, 243, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    /* Background Canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Main Container */
    .bio-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .bio-card:hover {
      box-shadow: 0 25px 60px rgba(0, 243, 255, 0.15),
                  inset 0 1px 2px rgba(255, 255, 255, 0.25);
    }

    /* Header Bar */
    .top-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      direction: ltr;
    }

    .developer-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.25);
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
    }

    .developer-tag i {
      font-size: 10px;
    }

    .location-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .location-tag i {
      color: #ff3b30;
      font-size: 12px;
    }

    /* Profile Avatar & Info */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 105px;
      height: 105px;
      margin-bottom: 4px;
    }

    .avatar-ring {
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      animation: rotateRing 6s linear infinite;
      opacity: 0.85;
      filter: blur(2px);
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #0d1121;
      background: #1a1f36;
      z-index: 2;
    }

    .profile-name {
      font-family: 'Orbitron', 'Vazirmatn', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      direction: ltr;
    }

    .verified-badge {
      color: #0095f6;
      font-size: 17px;
      filter: drop-shadow(0 0 6px rgba(0, 149, 246, 0.6));
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 11px;
      color: var(--text-muted);
      direction: ltr;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #34c759;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #34c759;
      border-radius: 50%;
      box-shadow: 0 0 8px #34c759;
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .divider-dot {
      width: 3px;
      height: 3px;
      background-color: var(--text-muted);
      border-radius: 50%;
      opacity: 0.5;
    }

    /* Social Icons Section */
    .social-icons-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin: 4px 0;
    }

    .social-tile {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      font-size: 22px;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .social-tile::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 18px;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: -1;
    }

    /* Hover States for Social Tile */
    .social-tile.telegram:hover {
      border-color: #0088cc;
      box-shadow: 0 0 20px rgba(0, 136, 204, 0.5);
      color: #229ed9;
      transform: translateY(-5px) scale(1.05);
    }

    .social-tile.instagram:hover {
      border-color: #e1306c;
      box-shadow: 0 0 20px rgba(225, 48, 108, 0.5);
      color: #f09433;
      transform: translateY(-5px) scale(1.05);
    }

    .social-tile.github:hover {
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      color: #ffffff;
      transform: translateY(-5px) scale(1.05);
    }

    /* Tech Stack Pills */
    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .tech-pill {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text-muted);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tech-pill:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.05);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    /* Audio Player Widget */
    .audio-widget {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      direction: ltr;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-cyan);
      border: none;
      color: #070913;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
      flex-shrink: 0;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.7);
    }

    .audio-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-grow: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .track-artist {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Visualizer Animation */
    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .bar {
      width: 3px;
      background: var(--accent-cyan);
      border-radius: 2px;
      height: 3px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: bounce 1s infinite ease-in-out alternate;
    }

    .playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .bar:nth-child(2) { animation-delay: 0.3s; }
    .playing .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 3px; }
      100% { height: 16px; }
    }

    /* Telegram Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 15, 0.8);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .telegram-modal {
      background: #0f1428;
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .telegram-modal {
      transform: translateY(0);
    }

    .close-modal {
      position: absolute;
      top: 16px;
      left: 16px;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .close-modal:hover {
      color: #fff;
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      background: rgba(0, 136, 204, 0.12);
      border: 1px solid rgba(0, 136, 204, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #229ed9;
      font-size: 26px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #0088cc, #005588);
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
    }

    .modal-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Particle Background Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Main Bio Card -->
  <div class="bio-card" id="bioCard">
    
    <!-- Top Header Bar -->
    <div class="top-header-bar">
      <div class="developer-tag">
        <i class="fa-solid fa-code"></i> Developer
      </div>
      <div class="location-tag">
        تبریز <i class="fa-solid fa-location-dot"></i>
      </div>
    </div>

    <!-- Profile Avatar & Title -->
    <div class="profile-section">
      <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="AMIRALI ZARE" class="avatar-img">
      </div>
      
      <div class="profile-name">
        AMIRALI ZARE <i class="fa-solid fa-circle-check verified-badge"></i>
      </div>

      <!-- Live Status & Clock -->
      <div class="status-bar">
        <div class="status-indicator">
          <span class="status-dot"></span> Online
        </div>
        <span class="divider-dot"></span>
        <div id="liveClock">--:--:--</div>
      </div>
    </div>

    <!-- Social Icons Grid (Pure Icons & Glass Glow) -->
    <div class="social-icons-grid">
      <div class="social-tile telegram" onclick="openTelegramModal()" title="تلگرام">
        <i class="fa-brands fa-telegram"></i>
      </div>
      <a href="https://instagram.com" target="_blank" class="social-tile instagram" title="اینستاگرام">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://github.com" target="_blank" class="social-tile github" title="گیت‌هاب">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>

    <!-- Tech Stack Skills -->
    <div class="tech-stack">
      <span class="tech-pill"><i class="fa-brands fa-html5"></i> HTML5</span>
      <span class="tech-pill"><i class="fa-brands fa-css3-alt"></i> CSS3</span>
      <span class="tech-pill"><i class="fa-brands fa-js"></i> JavaScript</span>
      <span class="tech-pill"><i class="fa-brands fa-python"></i> Python</span>
      <span class="tech-pill"><i class="fa-brands fa-git-alt"></i> Git</span>
    </div>

    <!-- Cyber Audio Widget -->
    <div class="audio-widget">
      <button class="play-btn" id="playAudioBtn" onclick="toggleAudio()">
        <i class="fa-solid fa-play" id="playIcon"></i>
      </button>
      <div class="audio-info">
        <div class="track-title">Cyberpunk Ambient Synth</div>
        <div class="track-artist">Background Track</div>
      </div>
      <div class="visualizer" id="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

  </div>

  <!-- Telegram Contact Modal -->
  <div class="modal-overlay" id="tgModalOverlay">
    <div class="telegram-modal">
      <i class="fa-solid fa-xmark close-modal" onclick="closeTelegramModal()"></i>
      <div class="modal-icon">
        <i class="fa-brands fa-telegram"></i>
      </div>
      <div class="modal-title">ارسال پیام در تلگرام</div>
      <div class="modal-sub">برای گفتگو مستقیم کلیک کنید</div>
      <a href="https://t.me" target="_blank" class="modal-btn">
        باز کردن تلگرام <i class="fa-solid fa-arrow-left"></i>
      </a>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="bgAudio" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73185.mp3?filename=cyberpunk-2099-10701.mp3"></audio>

  <script>
    // Live Tabriz Time
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US', options) + ' (تبریز)';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Audio Player Toggle
    const audio = document.getElementById('bgAudio');
    const playIcon = document.getElementById('playIcon');
    const visualizer = document.getElementById('visualizer');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
        visualizer.classList.add('playing');
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
        visualizer.classList.remove('playing');
      }
    }

    // Telegram Modal Handlers
    function openTelegramModal() {
      document.getElementById('tgModalOverlay').classList.add('active');
    }
    function closeTelegramModal() {
      document.getElementById('tgModalOverlay').classList.remove('active');
    }

    // Canvas Background Animation
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 45;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.speedY = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
