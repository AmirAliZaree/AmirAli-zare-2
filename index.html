<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIRALI ZARE | Cyber Portfolio & Bio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#04060a',
                            card: '#0a0f1d',
                            cyan: '#00f3ff',
                            purple: '#a855f7',
                            gold: '#fbbf24',
                            emerald: '#10b981',
                            telegram: '#229ed9',
                            instagram: '#e1306c',
                            github: '#f0f6fc'
                        }
                    },
                    fontFamily: {
                        sans: ['Vazirmatn', 'Inter', 'sans-serif'],
                        tech: ['Orbitron', 'JetBrains Mono', 'monospace']
                    },
                    animation: {
                        'spin-slow': 'spin 12s linear infinite',
                        'spin-reverse': 'spin-reverse 15s linear infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite'
                    },
                    keyframes: {
                        'spin-reverse': {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(-360deg)' }
                        },
                        pulseGlow: {
                            '0%': { opacity: '0.3', transform: 'scale(0.98)' },
                            '100%': { opacity: '0.8', transform: 'scale(1.02)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS Styling for Theme Dynamics & Micro-Interactions -->
    <style>
        :root {
            --neon-primary: #00f3ff;
            --neon-secondary: #a855f7;
            --neon-glow: rgba(0, 243, 255, 0.35);
            --border-glow: rgba(0, 243, 255, 0.25);
        }

        .theme-purple {
            --neon-primary: #a855f7;
            --neon-secondary: #00f3ff;
            --neon-glow: rgba(168, 85, 247, 0.35);
            --border-glow: rgba(168, 85, 247, 0.25);
        }

        .theme-gold {
            --neon-primary: #fbbf24;
            --neon-secondary: #f43f5e;
            --neon-glow: rgba(251, 191, 36, 0.35);
            --border-glow: rgba(251, 191, 36, 0.25);
        }

        body {
            background-color: #04060a;
            color: #f3f4f6;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .tech-font {
            font-family: 'Orbitron', 'JetBrains Mono', sans-serif;
            letter-spacing: 0.06em;
        }

        /* Premium Glass Panel */
        .glass-panel {
            background: rgba(10, 15, 29, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8),
                        0 0 30px var(--neon-glow);
        }

        /* 3D Tilt Card Base */
        .tilt-card {
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.15s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Brand Custom Interactive Link Cards */
        .cyber-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cyber-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: left 0.6s ease;
        }

        .cyber-card:hover::before {
            left: 100%;
        }

        /* Telegram Specialty Card Glow */
        .card-telegram:hover {
            border-color: #229ed9;
            box-shadow: 0 10px 30px -5px rgba(34, 158, 217, 0.4);
            transform: translateY(-4px);
        }

        /* Instagram Specialty Card Glow */
        .card-instagram:hover {
            border-color: #e1306c;
            box-shadow: 0 10px 30px -5px rgba(225, 48, 108, 0.4);
            transform: translateY(-4px);
        }

        /* Github Specialty Card Glow */
        .card-github:hover {
            border-color: #f0f6fc;
            box-shadow: 0 10px 30px -5px rgba(240, 246, 252, 0.25);
            transform: translateY(-4px);
        }

        /* Generic Accent Hover */
        .card-accent:hover {
            border-color: var(--neon-primary);
            box-shadow: 0 10px 30px -5px var(--neon-glow);
            transform: translateY(-4px);
        }

        /* Audio Visualizer Bar Animations */
        .v-bar {
            width: 3px;
            background: var(--neon-primary);
            border-radius: 4px;
            height: 4px;
            transition: height 0.2s ease, background-color 0.3s;
        }

        .playing .v-bar {
            animation: visualizer 0.8s ease-in-out infinite alternate;
        }

        .playing .v-bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .v-bar:nth-child(2) { animation-delay: 0.35s; }
        .playing .v-bar:nth-child(3) { animation-delay: 0.2s; }
        .playing .v-bar:nth-child(4) { animation-delay: 0.45s; }
        .playing .v-bar:nth-child(5) { animation-delay: 0.15s; }

        @keyframes visualizer {
            0% { height: 4px; }
            100% { height: 22px; }
        }

        /* Reactive Cursor Spotlight */
        #cursorGlow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--neon-glow) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: background 0.5s ease;
        }

        /* Holographic Text Effect */
        .holo-title {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 40%, var(--neon-primary) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Audio Slider Range */
        input[type=range] {
            accent-color: var(--neon-primary);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #04060a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 relative transition-colors duration-500">
