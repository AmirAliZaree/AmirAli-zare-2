    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#020408',
                            card: '#080d1a',
                            cyan: '#00f3ff',
                            purple: '#b026ff',
                            telegram: '#229ed9',
                            instagram: '#e1306c',
                            github: '#ffffff'
                        }
                    },
                    fontFamily: {
                        sans: ['Vazirmatn', 'Inter', 'sans-serif'],
                        tech: ['Orbitron', 'Rajdhani', 'JetBrains Mono', 'monospace']
                    },
                    animation: {
                        'spin-slow': 'spin 14s linear infinite',
                        'spin-reverse': 'spin-reverse 18s linear infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite alternate',
                        'float': 'float 5s ease-in-out infinite'
                    },
                    keyframes: {
                        'spin-reverse': {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(-360deg)' }
                        },
                        pulseGlow: {
                            '0%': { opacity: '0.25', transform: 'scale(0.96)' },
                            '100%': { opacity: '0.8', transform: 'scale(1.04)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }

    <!-- Google Fonts & Font Awesome 6 Icons -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --neon-primary: #00f3ff;
            --neon-secondary: #b026ff;
            --neon-glow: rgba(0, 243, 255, 0.4);
        }

        body {
            background-color: #020408;
            color: #f8fafc;
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        .stage-3d {
            perspective: 1200px;
        }

        /* High-End Holographic Glass Container */
        .ultra-glass {
            background: linear-gradient(135deg, rgba(13, 20, 38, 0.75) 0%, rgba(6, 10, 22, 0.85) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.9),
                        0 0 40px var(--neon-glow),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Base Glass Tile Structure */
        .glass-tile-base {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-tile-base::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            transition: left 0.75s ease;
        }

        .glass-tile-base:hover::after {
            left: 150%;
        }

        /* Authentic Brand Glassmorphism & Original Colors */
        /* Telegram Tile */
        .tile-telegram-brand {
            border-color: rgba(34, 158, 217, 0.35);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(34, 158, 217, 0.15);
        }
        .tile-telegram-brand:hover {
            border-color: #229ed9;
            background: linear-gradient(135deg, rgba(34, 158, 217, 0.25) 0%, rgba(0, 136, 204, 0.1) 100%);
            box-shadow: 0 0 30px rgba(34, 158, 217, 0.7), inset 0 0 15px rgba(34, 158, 217, 0.4);
            transform: translateY(-6px) scale(1.06);
        }
        .icon-telegram-original {
            color: #229ed9;
            filter: drop-shadow(0 0 10px rgba(34, 158, 217, 0.8));
        }

        /* Instagram Tile (Original Gradient Icon) */
        .tile-instagram-brand {
            border-color: rgba(225, 48, 108, 0.35);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(225, 48, 108, 0.15);
        }
        .tile-instagram-brand:hover {
            border-color: #e1306c;
            background: linear-gradient(135deg, rgba(225, 48, 108, 0.25) 0%, rgba(240, 148, 51, 0.15) 100%);
            box-shadow: 0 0 30px rgba(225, 48, 108, 0.7), inset 0 0 15px rgba(240, 148, 51, 0.4);
            transform: translateY(-6px) scale(1.06);
        }
        .icon-instagram-original {
            background: -webkit-linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(225, 48, 108, 0.8));
        }

        /* GitHub Tile */
        .tile-github-brand {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .tile-github-brand:hover {
            border-color: #ffffff;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateY(-6px) scale(1.06);
        }
        .icon-github-original {
            color: #ffffff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        /* Music Equalizer Visualizer */
        .v-bar {
            width: 3px;
            background: var(--neon-primary);
            border-radius: 4px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .playing .v-bar {
            animation: visualizer 0.7s ease-in-out infinite alternate;
        }

        .playing .v-bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .v-bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .v-bar:nth-child(3) { animation-delay: 0.5s; }
        .playing .v-bar:nth-child(4) { animation-delay: 0.2s; }
        .playing .v-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes visualizer {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        #cursorGlow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--neon-glow) 0%, transparent 65%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: background 0.5s ease;
        }

        .tech-font {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            letter-spacing: 0.08em;
        }

        .holo-text {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 40%, var(--neon-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #020408; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>

    </div>

    <!-- Notification Toast Box -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-slate-900/90 border border-[var(--neon-primary)] text-xs text-slate-200 flex items-center gap-2 shadow-[0_0_20px_var(--neon-glow)] opacity-0 pointer-events-none transition-all duration-300">
        <i class="fa-solid fa-circle-check text-[var(--neon-primary)]"></i>
        <span id="toastMsg">پیام ارسال شد</span>
    </div>

    <!-- Background Audio Element -->
    <audio id="bgAudio" loop preload="none">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const mainCard = document.getElementById('mainCard');
                mainCard.classList.remove('opacity-0', 'scale-95');
                mainCard.classList.add('opacity-100', 'scale-100');
            }, 100);
            initTypewriter();
            initParticles();
            init3DTilt();
            updateTabrizClock();
            setInterval(updateTabrizClock, 1000);
        });

        // Tabriz Live Clock
        function updateTabrizClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const clockEl = document.getElementById('liveClock');
            if (clockEl) {
                clockEl.textContent = now.toLocaleTimeString('en-US', options) + ' (تبریز)';
            }
        }

        // Spotlight Follower
        const cursorGlow = document.getElementById('cursorGlow');
        window.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = `${e.clientX}px`;
            cursorGlow.style.top = `${e.clientY}px`;
        });

        // 3D Card Tilt
        function init3DTilt() {
            const card = document.getElementById('mainCard');
            window.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                if (e.clientX > rect.left - 50 && e.clientX < rect.right + 50 &&
                    e.clientY > rect.top - 50 && e.clientY < rect.bottom + 50) {
                    const tiltX = (y / rect.height) * -8;
                    const tiltY = (x / rect.width) * 8;
                    card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.01)`;
                } else {
                    card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
                }
            });
        }

        // Typewriter Effect
        const phrases = ["سیستم در حال اجرا است...", "طراح و توسعه‌دهنده وب", "Cyberpunk Bio Interface", "خوش آمدید به پروفایل من"];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingElement = document.getElementById('typingText');

        function initTypewriter() {
            const currentPhrase = phrases[phraseIndex];
            if (isDeleting) {
                typingElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typingElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            let speed = isDeleting ? 40 : 80;

            if (!isDeleting && charIndex === currentPhrase.length) {
                speed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                speed = 400;
            }

            setTimeout(initTypewriter, speed);
        }

        function pulseAvatar() {
            showToast("AMIRALI ZARE ⚡");
        }

        // Audio System
        const bgAudio = document.getElementById('bgAudio');
        const playBtnIcon = document.getElementById('playBtnIcon');
        const visualizer = document.getElementById('visualizer');
        const musicDisc = document.getElementById('musicDisc');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                bgAudio.pause();
                playBtnIcon.className = 'fa-solid fa-play text-xs';
                visualizer.classList.remove('playing');
                musicDisc.classList.remove('animate-spin-slow');
                isPlaying = false;
            } else {
                bgAudio.play().then(() => {
                    playBtnIcon.className = 'fa-solid fa-pause text-xs';
                    visualizer.classList.add('playing');
                    musicDisc.classList.add('animate-spin-slow');
                    isPlaying = true;
                }).catch(() => {
                    showToast("لطفاً برای پخش مجدد کلیک کنید");
                });
            }
        }

        bgAudio.addEventListener('timeupdate', () => {
            if (bgAudio.duration) {
                const pct = (bgAudio.currentTime / bgAudio.duration) * 100;
                progressBar.style.width = `${pct}%`;
                
                const mins = Math.floor(bgAudio.currentTime / 60);
                const secs = Math.floor(bgAudio.currentTime % 60);
                currentTimeEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        });

        function seekAudio(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (bgAudio.duration) {
                bgAudio.currentTime = pos * bgAudio.duration;
            }
        }

        function changeVolume(val) {
            bgAudio.volume = val;
        }

        // Telegram Modal Dialog
        function openTelegramModal() {
            const modal = document.getElementById('telegramModal');
            const modalCard = document.getElementById('telegramModalCard');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');
        }

        function closeTelegramModal() {
            const modal = document.getElementById('telegramModal');
            const modalCard = document.getElementById('telegramModalCard');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function setMsg(txt) {
            document.getElementById('tgMessageText').value = txt;
        }

        function sendTelegramMsg() {
            const txt = document.getElementById('tgMessageText').value;
            const tgUsername = "AmiraliZare"; 
            const url = `https://t.me/${tgUsername}?text=${encodeURIComponent(txt || 'سلام امیرعلی عزیز')}`;
            window.open(url, '_blank');
            closeTelegramModal();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Particle Canvas
        function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const particles = [];
            const count = Math.min(window.innerWidth / 20, 50);

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 243, 255, ${p.alpha})`;
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
