<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMIRALI ZARE | Cyber Bio</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Vazirmatn & Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #04060a;
      --accent-cyan: #00f3ff;
      --accent-magenta: #ff0055;
      --accent-purple: #9d00ff;
      --text-main: #ffffff;
      --text-muted: #808ea3;
      --glass-bg: rgba(8, 11, 22, 0.75);
      --glass-border: rgba(0, 243, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    /* Cyber Scanline Effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 5;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    /* Particle Background Canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Main Container */
    .bio-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 430px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95),
                  0 0 40px rgba(0, 243, 255, 0.1),
                  inset 0 1px 2px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow: hidden;
    }

    .bio-card::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      animation: scanLaser 4s linear infinite;
    }

    @keyframes scanLaser {
      0% { left: -100%; }
      50%, 100% { left: 100%; }
    }

    /* Header Bar */
    .top-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      direction: ltr;
    }

    .developer-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .location-tag {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .location-tag i {
      color: #ff2a5f;
      font-size: 13px;
      filter: drop-shadow(0 0 5px #ff2a5f);
    }

    /* Profile Avatar & Info */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 4px;
    }

    .avatar-ring {
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta), var(--accent-purple));
      animation: rotateRing 4s linear infinite;
      opacity: 0.9;
      filter: blur(3px);
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #050811;
      background: #0f172a;
      z-index: 2;
    }

    .profile-name {
      font-family: 'Orbitron', 'Vazirmatn', sans-serif;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      direction: ltr;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .verified-badge {
      color: #0095f6;
      font-size: 18px;
      filter: drop-shadow(0 0 8px rgba(0, 149, 246, 0.8));
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 7px 16px;
      border-radius: 50px;
      font-size: 11px;
      color: var(--text-muted);
      direction: ltr;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #00ff88;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff88;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    /* Social Icons Section */
    .social-icons-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      width: 100%;
      margin: 6px 0;
    }

    .social-tile {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 25px;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .social-tile.telegram {
      color: #229ed9;
    }
    .social-tile.telegram:hover {
      background: rgba(34, 158, 217, 0.15);
      border-color: #229ed9;
      box-shadow: 0 0 30px rgba(34, 158, 217, 0.7), inset 0 0 15px rgba(34, 158, 217, 0.4);
      transform: translateY(-6px) scale(1.08);
    }

    .social-tile.instagram {
      color: #f09433;
    }
    .social-tile.instagram i {
      background: -webkit-linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .social-tile.instagram:hover {
      background: rgba(225, 48, 108, 0.15);
      border-color: #e1306c;
      box-shadow: 0 0 30px rgba(225, 48, 108, 0.7), inset 0 0 15px rgba(225, 48, 108, 0.4);
      transform: translateY(-6px) scale(1.08);
    }

    .social-tile.github {
      color: #ffffff;
    }
    .social-tile.github:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffffff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.3);
      transform: translateY(-6px) scale(1.08);
    }

    /* Tech Stack Pills */
    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .tech-pill {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 600;
      padding: 6px 13px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text-muted);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tech-pill:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 243, 255, 0.08);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }

    /* Audio Player Widget */
    .audio-widget {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      direction: ltr;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), #0088ff);
      border: none;
      color: #04060a;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
      flex-shrink: 0;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(0, 243, 255, 0.8);
    }

    .audio-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-grow: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .track-artist {
      font-size: 10px;
      color: var(--text-muted);
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .bar {
      width: 3px;
      background: var(--accent-cyan);
      border-radius: 2px;
      height: 3px;
    }

    .playing .bar {
      animation: bounce 1s infinite ease-in-out alternate;
    }

    .playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .bar:nth-child(2) { animation-delay: 0.3s; }
    .playing .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 3px; }
      100% { height: 16px; }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(4, 6, 10, 0.85);
      backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .telegram-modal {
      background: #090e1a;
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }

    .close-modal {
      position: absolute;
      top: 16px; left: 16px;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .modal-icon {
      width: 60px; height: 60px;
      background: rgba(34, 158, 217, 0.15);
      border: 1px solid rgba(34, 158, 217, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #229ed9;
      font-size: 26px;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #0088cc, #005588);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="bio-card">
    
    <div class="top-header-bar">
      <div class="developer-tag">
        <i class="fa-solid fa-code"></i> Developer
      </div>
      <div class="location-tag">
        تبریز <i class="fa-solid fa-location-dot"></i>
      </div>
    </div>

    <div class="profile-section">
      <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        <img src="profile.jpg" alt="AMIRALI ZARE" class="avatar-img">
      </div>
      
      <div class="profile-name">
        AMIRALI ZARE <i class="fa-solid fa-circle-check verified-badge"></i>
      </div>

      <div class="status-bar">
        <div class="status-indicator">
          <span class="status-dot"></span> Online
        </div>
        <span style="opacity: 0.3;">|</span>
        <div id="liveClock">--:--:--</div>
      </div>
    </div>

    <div class="social-icons-grid">
      <div class="social-tile telegram" onclick="openTelegramModal()" title="تلگرام">
        <i class="fa-brands fa-telegram"></i>
      </div>
      <a href="https://instagram.com" target="_blank" class="social-tile instagram" title="اینستاگرام">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://github.com" target="_blank" class="social-tile github" title="گیت‌هاب">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>

    <div class="tech-stack">
      <span class="tech-pill"><i class="fa-brands fa-html5"></i> HTML5</span>
      <span class="tech-pill"><i class="fa-brands fa-css3-alt"></i> CSS3</span>
      <span class="tech-pill"><i class="fa-brands fa-js"></i> JavaScript</span>
      <span class="tech-pill"><i class="fa-brands fa-python"></i> Python</span>
      <span class="tech-pill"><i class="fa-brands fa-git-alt"></i> Git</span>
    </div>

    <div class="audio-widget">
      <button class="play-btn" onclick="toggleAudio()">
        <i class="fa-solid fa-play" id="playIcon"></i>
      </button>
      <div class="audio-info">
        <div class="track-title">Cyberpunk Ambient Synth</div>
        <div class="track-artist">Background Track</div>
      </div>
      <div class="visualizer" id="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="tgModalOverlay">
    <div class="telegram-modal">
      <i class="fa-solid fa-xmark close-modal" onclick="closeTelegramModal()"></i>
      <div class="modal-icon">
        <i class="fa-brands fa-telegram"></i>
      </div>
      <h3 style="color:#fff; font-size:16px;">ارسال پیام در تلگرام</h3>
      <p style="color:var(--text-muted); font-size:12px; margin-top:4px;">برای گفتگو مستقیم کلیک کنید</p>
      <a href="https://t.me" target="_blank" class="modal-btn">
        باز کردن تلگرام <i class="fa-solid fa-arrow-left"></i>
      </a>
    </div>
  </div>

  <audio id="bgAudio" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73185.mp3?filename=cyberpunk-2099-10701.mp3"></audio>

  <script>
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US', options) + ' (تبریز)';
    }
    setInterval(updateClock, 1000);
    updateClock();

    const audio = document.getElementById('bgAudio');
    const playIcon = document.getElementById('playIcon');
    const visualizer = document.getElementById('visualizer');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
        visualizer.classList.add('playing');
      } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
        visualizer.classList.remove('playing');
      }
    }

    function openTelegramModal() {
      document.getElementById('tgModalOverlay').classList.add('active');
    }
    function closeTelegramModal() {
      document.getElementById('tgModalOverlay').classList.remove('active');
    }

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
